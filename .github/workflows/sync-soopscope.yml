name: Periodic SoopScope Snapshot

on:
  schedule:
    # 10분 간격으로 수집
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      target_month:
        description: '대상 월 (예: 2026-10). 비워두면 현재 월(한국시간 기준)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-soopscope
  cancel-in-progress: false

jobs:
  sync-viewership:
    runs-on: ubuntu-latest
    name: Sync SoopScope Viewership (Sequential)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Sequential Viewership Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TARGET_MONTH="${{ inputs.target_month }}"
          if [ -z "$TARGET_MONTH" ]; then
            TARGET_MONTH=$(TZ="Asia/Seoul" date +'%Y-%m')
          fi
          node scripts/sync-viewership.mjs "$TARGET_MONTH"

      - name: Commit and Push Changes If Updated
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet src/data/viewershipSnapshots.ts src/lib/starCrewsData.ts; then
            git add src/data/ src/lib/starCrewsData.ts
            TIMESTAMP=$(TZ="Asia/Seoul" date +'%Y-%m-%d %H:%M:%S')
            TARGET_STR="${{ inputs.target_month }}"
            if [ -z "$TARGET_STR" ]; then
              TARGET_STR=$(TZ="Asia/Seoul" date +'%Y-%m')
            fi
            git commit -m "chore(sync): update $TARGET_STR snapshot [$TIMESTAMP KST]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Successfully synced and pushed snapshot."
          elif ! git diff --quiet src/data/syncLogs.ts; then
            git add src/data/syncLogs.ts
            TIMESTAMP=$(TZ="Asia/Seoul" date +'%Y-%m-%d %H:%M:%S')
            git commit -m "chore(sync): record sync run log [$TIMESTAMP KST]"
            git pull --rebase origin main
            git push origin main
            echo "ℹ️ Recorded sync status log."
          else
            echo "ℹ️ No changes detected. Skipping commit."
          fi
