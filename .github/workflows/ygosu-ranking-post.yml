name: Periodic Ygosu Ranking Post

on:
  schedule:
    # 골든타임 4시간 주기 (KST 기준 14:00, 18:00, 22:00, 02:00 / 일 4회)
    # UTC 기준: 05:00, 09:00, 13:00, 17:00 -> 0 5,9,13,17 * * *
    - cron: '0 5,9,13,17 * * *'
  workflow_dispatch:
    inputs:
      board:
        description: '게시판 코드 (기본값: pan_prison,starbbs - 쉼표로 복수 지정 가능)'
        required: false
        default: 'pan_prison,starbbs'
      title:
        description: '게시글 제목 (기본값 "auto": [MM/DD HH시 기준] 스타크루 별풍선 & 뷰어십 랭킹 / 개인 TOP 10 자동 생성)'
        required: false
        default: 'auto'

concurrency:
  group: ygosu-ranking-post
  cancel-in-progress: false

jobs:
  post-to-ygosu:
    runs-on: ubuntu-latest
    name: Capture Leaderboards & Post to Ygosu
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          npx playwright install --with-deps chromium
          python -m playwright install chromium

      - name: Capture 4 Ranking Screenshots
        run: |
          node scripts/capture_leaderboards.js "https://soop-star-naksoopyo.pages.dev"

      - name: Publish Post to Ygosu
        env:
          YGOSU_ID: ${{ secrets.YGOSU_ID }}
          YGOSU_PW: ${{ secrets.YGOSU_PW }}
          YGOSU_BOARD: ${{ inputs.board || secrets.YGOSU_BOARD || 'pan_prison,starbbs' }}
          POST_TITLE: ${{ inputs.title || 'auto' }}
        run: |
          python3 scripts/ygosu_post.py --auto-submit --headless
