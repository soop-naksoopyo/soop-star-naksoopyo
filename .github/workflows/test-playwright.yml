name: Test SoopScope Browser Access

on:
  workflow_dispatch:

jobs:
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Test Browser Script
        run: |
          node -e "
          import('playwright').then(async ({ chromium }) => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-blink-features=AutomationControlled']
            });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            // 모든 네트워크 요청/응답 기록
            const captured = [];
            page.on('response', async (response) => {
              const url = response.url();
              if (url.includes('api') || url.includes('json') || url.includes('supabase') || url.includes('stats')) {
                captured.push({
                  url: url.slice(0, 120),
                  status: response.status()
                });
              }
            });

            console.log('Navigating to rank page with domcontentloaded...');
            await page.goto('https://soopscope.com/rank', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(5000);

            // 페이지 타이틀 및 테이블 내 텍스트 확인
            const title = await page.title();
            const textSample = (await page.innerText('body')).slice(0, 500);
            console.log('Page Title:', title);
            console.log('Body Sample:', textSample.replace(/\n+/g, ' '));
            console.log('Captured APIs:', JSON.stringify(captured, null, 2));

            await browser.close();
          }).catch(err => {
            console.error('Fatal error:', err.message);
            process.exit(1);
          });
          "
