name: Test SoopScope Browser Access

on:
  workflow_dispatch:

jobs:
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Test Browser Script
        run: |
          node -e "
          import('playwright').then(async ({ chromium }) => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-blink-features=AutomationControlled']
            });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            // 모든 네트워크 요청/응답 기록
            const captured = [];
            page.on('response', async (response) => {
              const url = response.url();
              if (url.includes('api') || url.includes('json') || url.includes('supabase') || url.includes('stats')) {
                captured.push({
                  url: url.slice(0, 120),
                  status: response.status()
                });
              }
            });

            console.log('Navigating to streamer minchul page...');
            await page.goto('https://soopscope.com/streamer/minchul', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(5000);

            const title = await page.title();
            const bodyText = await page.innerText('body');
            console.log('Streamer Page Title:', title);
            console.log('Body Text length:', bodyText.length);
            console.log('Body Text sample:', bodyText.slice(0, 500).replace(/\n+/g, ' '));
            const hasBalloons = bodyText.includes('별풍선') || bodyText.includes('풍') || bodyText.includes('시간');
            console.log('Contains balloon/time keywords:', hasBalloons);

            await browser.close();
          }).catch(err => {
            console.error('Fatal error:', err.message);
            process.exit(1);
          });
          "
