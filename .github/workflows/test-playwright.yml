name: Test SoopScope Browser Access

on:
  workflow_dispatch:

jobs:
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Test Browser Script
        run: |
          node -e "
          import('playwright').then(async ({ chromium }) => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-blink-features=AutomationControlled']
            });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            // 네트워크 응답 인터셉트
            const capturedResponses = [];
            page.on('response', async (response) => {
              const url = response.url();
              if (url.includes('/api/')) {
                capturedResponses.push({
                  url: url.slice(0, 100),
                  status: response.status(),
                });
              }
            });

            console.log('Navigating to streamer page...');
            const res = await page.goto('https://soopscope.com/streamer/minchul', { waitUntil: 'networkidle', timeout: 30000 });
            console.log('Page status:', res.status());

            // 페이지 내부 텍스트 중 별풍선 관련 텍스트 추출
            const bodyText = await page.innerText('body');
            const has53200 = bodyText.includes('53,200') || bodyText.includes('53200');
            console.log('Has 53200 in page text:', has53200);

            console.log('Captured API responses:', JSON.stringify(capturedResponses));
            await browser.close();
          }).catch(err => {
            console.error('Fatal error:', err.message);
            process.exit(1);
          });
          "
